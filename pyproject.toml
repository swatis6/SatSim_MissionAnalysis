[project]
name = "satsim"
version = "0.1.0"
description = "A modular Python simulation environment for CubeSat mission analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy>=7.2.0,<8",
    "matplotlib>=3.10.8,<4",
    "numpy>=2.4.3,<3",
    "pandas>=3.0.1,<4",
    "plotly>=6.6.0,<7",
    "pyyaml>=6.0.3,<7",
    "scipy>=1.17.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satsim"]

[tool.pytest.ini_options]
pythonpath = ["src/satsim", "src/satsim/subsystems"]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["src/satsim", "src/satsim/subsystems"]
